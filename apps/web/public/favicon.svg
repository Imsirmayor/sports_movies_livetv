<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Pulse Stream">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#0F0F11"/>
  <rect x="128" y="128" width="768" height="768" rx="176" fill="url(#g)"/>
  <!-- soft red pulse behind bars -->
  <ellipse cx="512" cy="560" rx="210" ry="90" fill="#FF4D55" opacity="0.35" filter="url(#glow)"/>
  <!-- equalizer bars -->
  <g fill="#FFFFFF">
    <rect x="326" y="470" width="56" height="180" rx="18"/>
    <rect x="406" y="390" width="56" height="260" rx="18"/>
    <rect x="486" y="330" width="56" height="320" rx="18"/>
    <rect x="566" y="410" width="56" height="240" rx="18"/>
    <rect x="646" y="450" width="56" height="200" rx="18"/>
  </g>
</svg>
